:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Manrope","Inter",system-ui,sans-serif;
  --bg:#F2F7FD; --surface:#FFFFFF; --surface-2:#F6F8FC; --surface-3:#EDF1F8;
  --ink:#181344; --ink-2:#4B496A; --muted:#7C7B94; --faint:#AAA9BD;
  --line:#E6E7F0; --line-2:#F0F1F6;
  --brand:#0027EA; --brand-600:#0020C0; --brand-050:#E7EFFB; --brand-100:#DEEAFB;
  --purpleA:#E9DEFB; --purpleB:#A98BF3; --purple:#915BF8;
  --yellow:#FFD900; --yellow-600:#E9C400; --yellow-bg:#FFF6C2; --yellow-ink:#181344;
  --ink-btn:#0B0B14; --ink-btn-fg:#FFFFFF;
  --ok:#117A24; --ok-bg:#E7F2E9;
  --warn:#B7791F; --warn-bg:#FBF1DF; --orange:#E0842E; --orange-bg:#FBEEE0;
  --danger:#DB3032; --danger-bg:#FBE9E9;
  --shadow-sm:0 1px 2px rgba(24,19,68,.05);
  --shadow:0 2px 8px rgba(24,19,68,.06),0 18px 40px -26px rgba(24,19,68,.22);
  --shadow-lg:0 30px 80px -30px rgba(24,19,68,.5);
  --r-lg:16px; --r:12px; --r-sm:9px; --r-btn:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0E17; --surface:#161826; --surface-2:#1C1F30; --surface-3:#232739;
  --ink:#ECEEF7; --ink-2:#BFC2D4; --muted:#8E92A8; --faint:#6A6E85;
  --line:rgba(180,186,220,.14); --line-2:rgba(180,186,220,.08);
  --brand:#6E82FF; --brand-600:#8A9AFF; --brand-050:rgba(110,130,255,.16); --brand-100:rgba(110,130,255,.14);
  --purpleA:#2A2350; --purpleB:#5B3fb0; --purple:#A98BF3;
  --yellow:#FFDE2E; --yellow-600:#E9C400; --yellow-bg:rgba(255,217,0,.16); --yellow-ink:#181344;
  --ink-btn:#ECEEF7; --ink-btn-fg:#161826;
  --ok:#3ECB74; --ok-bg:rgba(62,203,116,.15);
  --warn:#E4B24A; --warn-bg:rgba(228,178,74,.15); --orange:#F0A055; --orange-bg:rgba(240,160,85,.15);
  --danger:#F0656B; --danger-bg:rgba(240,101,107,.15);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 10px rgba(0,0,0,.45),0 20px 46px -26px rgba(0,0,0,.8);
  --shadow-lg:0 34px 80px -30px rgba(0,0,0,.85);
}}

*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tileIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.content{animation:pageIn .30s cubic-bezier(.22,.61,.36,1) both}
.login-card{animation:pageIn .34s cubic-bezier(.22,.61,.36,1) both}
.tiles .tile{animation:tileIn .40s cubic-bezier(.22,.61,.36,1) both}
.tiles .tile:nth-child(2){animation-delay:.06s}.tiles .tile:nth-child(3){animation-delay:.12s}.tiles .tile:nth-child(4){animation-delay:.18s}
body,.site-hd,.topnav,.panel,.card,.foot,.dbar,.summary,.inp,.sel,.chip,.tag,.welcome,.stepper .st,table.tbl th,table.tbl td{transition:background-color .3s ease,border-color .3s ease,color .25s ease}
.panel-bd{overflow:hidden;transition:max-height .3s ease,opacity .22s ease,padding-bottom .3s ease;max-height:560px}
.panel.collapsed>.panel-bd{max-height:0;opacity:0;padding-bottom:0}
.panel-hd .chev{transition:transform .25s ease}.panel.collapsed .panel-hd .chev{transform:rotate(-90deg)}
.panel-hd .chev svg{width:15px;height:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--display);letter-spacing:-.02em;line-height:1.15}
p{margin:0}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--brand);color:#fff}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

.site-hd{background:var(--surface);border-bottom:1px solid var(--line)}
.site-hd .in{max-width:1320px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;row-gap:10px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.04em;color:var(--ink)}
.logo .d{color:var(--brand)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.support{font-size:13px;color:var(--muted)} .support b{color:var(--ink);font-weight:700}
.hd-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hd-link:hover{color:var(--brand)} .hd-link svg{width:16px;height:16px}
.hd-cart{background:var(--ink-btn);color:var(--ink-btn-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.hd-cart svg{width:16px;height:16px}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;font-weight:800;font-size:11px}
.mini:hover{border-color:var(--brand);color:var(--brand)} .mini svg{width:16px;height:16px}

.topnav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.topnav .in{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:4px}
.navitem{position:relative}
.navitem>button,.navitem>a{background:0;border:0;padding:16px 16px;font-size:14.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent}
.navitem:hover>button,.navitem:hover>a{color:var(--ink)}
.navitem.on>button,.navitem.on>a{color:var(--brand);border-bottom-color:var(--brand)}
.navitem>button svg{width:14px;height:14px;transition:transform .15s}
.navitem.open>button svg{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:8px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:7px;z-index:70;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top left;transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s}

/* ===== modals ===== */
const MODALS={
 sms:()=>mk('sms','var(--warn-bg)','var(--warn)',x('Подтверждение по SMS','SMS confirmation'),`<p class="fs13 mut" style="margin-bottom:16px">${x('Мы отправили код на номер','We sent a code to')} <b style="color:var(--ink)">+375 33 •••• 04-84</b>.</p><div style="display:flex;gap:9px;justify-content:center">${[0,1,2,3].map(()=>`<input class="inp tnum" maxlength="1" style="width:52px;height:58px;text-align:center;font-size:24px;font-weight:700">`).join('')}</div>`,`<button class="btn btn-ghost" data-close>${x('Отмена','Cancel')}</button><button class="btn btn-primary" data-toast="${x('Доступ открыт — демо','Access granted — demo')}" data-close>${x('Подтвердить','Confirm')}</button>`),
 pin:()=>mk('key','var(--purpleA)','var(--purple)',x('Активация PIN','Activate PIN'),`<p class="fs13 mut" style="margin-bottom:16px">${x('Задайте PIN-код для входа в кабинет.','Set a PIN for signing in.')}</p><div class="field"><label>${x('Новый PIN','New PIN')}</label><input class="inp" type="password" placeholder="••••"></div>`,`<button class="btn btn-ghost" data-close>${x('Отмена','Cancel')}</button><button class="btn btn-primary" data-toast="${x('PIN активирован — демо','PIN activated — demo')}" data-close>${x('Активировать','Activate')}</button>`),
 pay:(id)=>mk('wallet','var(--brand-050)','var(--brand)',x('Оплата счёта','Pay invoice')+' #'+id,`<p class="fs13 mut" style="margin-bottom:14px">${x('Способ оплаты для счёта на','Payment method for')} <b style="color:var(--ink)">21.00 руб.</b></p>${[x('ЕРИП / Расчёт','ERIP / Raschet'),x('Карта (bePaid)','Card (bePaid)'),'Apple Pay',x('Баланс','Balance')].map((m,i)=>`<label class="card" style="display:flex;gap:11px;align-items:center;padding:12px;margin-bottom:8px;cursor:pointer;${i===0?'border-color:var(--brand)':''}"><input type="radio" name="p" ${i===0?'checked':''} style="accent-color:var(--brand);width:17px;height:17px"><b class="fs13">${m}</b></label>`).join('')}`,`<button class="btn btn-ghost" data-close>${x('Отмена','Cancel')}</button><button class="btn btn-brand" data-toast="${x('К оплате — демо','To payment — demo')}" data-close>${x('Оплатить','Pay')}</button>`),
 cancel:(n)=>mk('warn','var(--danger-bg)','var(--danger)',x('Запрос на отмену','Cancellation request'),`<p class="fs13 mut">${x('Отмена услуги','Cancel service')} <b style="color:var(--ink)">${n}</b>. ${x('Услуга отключится в конце оплаченного периода.','The service is disabled at the end of the paid period.')}</p>`,`<button class="btn btn-ghost" data-close>${x('Назад','Back')}</button><button class="btn btn-danger" data-toast="${x('Запрос отправлен — демо','Request sent — demo')}" data-close>${x('Запросить отмену','Request cancellation')}</button>`),
 dns:(n)=>mk('dns','var(--brand-050)','var(--brand)','DNS · '+n,`<div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>${x('Тип','Type')}</th><th>${x('Имя','Name')}</th><th>${x('Значение','Value')}</th></tr></thead><tbody><tr><td class="main">A</td><td>@</td><td class="tnum">178.172.x.x</td></tr><tr><td class="main">A</td><td>www</td><td class="tnum">178.172.x.x</td></tr><tr><td class="main">MX</td><td>@</td><td>mail.hostfly.by</td></tr></tbody></table></div>`,`<button class="btn btn-ghost" data-close>${x('Закрыть','Close')}</button><button class="btn btn-primary" data-nav="dnsmgr">${x('Открыть редактор','Open editor')}</button>`,'wide'),
 ticketform:(dep)=>mk('chat','var(--brand-050)','var(--brand)',x('Новый запрос','New ticket')+' · '+dep,`<div class="field"><label>${x('Тема','Subject')}</label><input class="inp" placeholder="${x('Кратко опишите проблему','Briefly describe the issue')}"></div><div class="field mb0"><label>${x('Сообщение','Message')}</label><textarea class="inp" rows="4"></textarea></div>`,`<button class="btn btn-ghost" data-close>${x('Отмена','Cancel')}</button><button class="btn btn-primary" data-toast="${x('Запрос создан — демо','Ticket created — demo')}" data-close>${x('Отправить','Send')}</button>`,'wide'),
 ordered:()=>mk('check','var(--ok-bg)','var(--ok)',x('Заказ оформлен!','Order placed!'),`<p class="fs13 mut">${x('Заказ принят, выставлен счёт. После оплаты услуга активируется автоматически. Это демо.','Order accepted, invoice issued. After payment the service activates automatically. This is a demo.')}</p>`,`<button class="btn btn-primary" data-nav="dashboard" data-close>${x('На главную','To home')}</button>`),
 notifs:()=>{const D=DATA();return mk('warn','var(--brand-050)','var(--brand)',x('Уведомления','Notifications'),D.notifs.map(n=>`<div style="display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)"><div class="mico" style="width:34px;height:34px;background:var(--surface-2);color:var(--brand)">${n.ic}</div><div style="min-width:0"><div class="fs13" style="font-weight:${n.unread?'600':'500'}">${n.t}</div><div class="fs13 mut">${n.time}</div></div></div>`).join(''),`<button class="btn btn-ghost btn-block" data-close>${x('Закрыть','Close')}</button>`,'wide');},
};
function mk(icon,bg,col,title,body,foot,wide){return `<div class="modal ${wide||''}"><div class="modal-hd"><div class="mico" style="background:${bg};color:${col}">${ic[icon]}</div><h3>${title}</h3><button class="x" data-close>${ic.x}</button></div><div class="modal-bd">${body}</div><div class="modal-ft">${foot}</div></div>`;}
function openModal(name,arg){const r=document.getElementById('modal-root');r.innerHTML=`<div class="overlay" data-overlay>${MODALS[name](arg)}</div>`;requestAnimationFrame(()=>{const o=r.querySelector('.overlay');if(o)o.classList.add('on');});bind();}
function closeModal(){const o=document.querySelector('.overlay');if(o){o.classList.remove('on');setTimeout(()=>document.getElementById('modal-root').innerHTML='',180);}}

/* ===== behaviour ===== */
let tT;function toast(m){const t=document.getElementById('toast');t.innerHTML=ic.check+'<span>'+m+'</span>';t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200);}
function toggleTheme(){const r=document.documentElement;const c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',c==='dark'?'light':'dark');}
function toggleLang(){lang=lang==='ru'?'en':'ru';render();}
function animCounters(){document.querySelectorAll('[data-count]:not([data-anim])').forEach(el=>{el.setAttribute('data-anim','1');const target=parseFloat(el.getAttribute('data-count'))||0;if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=target;return;}const dur=700;let t0=null;requestAnimationFrame(function tick(now){if(t0===null)t0=now;const p=Math.min(1,(now-t0)/dur);el.textContent=Math.round((1-Math.pow(1-p,3))*target);if(p<1)requestAnimationFrame(tick);});});}
function bind(){
 document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.stopPropagation();closeModal();go(el.getAttribute('data-nav'));document.getElementById('panels')?.classList.remove('show');document.querySelector('.scrim')?.classList.remove('on');});
 document.querySelectorAll('[data-modal]').forEach(el=>el.onclick=e=>{e.stopPropagation();openModal(el.getAttribute('data-modal'),el.getAttribute('data-arg'));});
 document.querySelectorAll('[data-close]').forEach(el=>el.onclick=e=>{e.stopPropagation();closeModal();});
 document.querySelectorAll('[data-overlay]').forEach(el=>el.onclick=e=>{if(e.target===el)closeModal();});
 document.querySelectorAll('[data-toast]').forEach(el=>el.onclick=e=>{e.stopPropagation();toast(el.getAttribute('data-toast'));});
 document.querySelectorAll('[data-theme-toggle]').forEach(el=>el.onclick=toggleTheme);
 document.querySelectorAll('[data-lang-toggle]').forEach(el=>el.onclick=toggleLang);
 document.querySelectorAll('[data-toggle-side]').forEach(el=>el.onclick=()=>{document.getElementById('panels')?.classList.toggle('show');document.querySelector('.scrim')?.classList.toggle('on');});
 document.querySelectorAll('[data-close-side]').forEach(el=>el.onclick=()=>{document.getElementById('panels')?.classList.remove('show');document.querySelector('.scrim')?.classList.remove('on');});
 document.querySelectorAll('[data-fill]').forEach(el=>el.onclick=()=>{const i=document.querySelector('.inp');if(i)i.value=el.getAttribute('data-fill');});
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('on'));el.classList.add('on');});
 document.querySelectorAll('[data-order]').forEach(el=>el.onclick=()=>{orderStep+=el.getAttribute('data-order')==='next'?1:-1;orderStep=Math.max(1,Math.min(4,orderStep));render();});
 animCounters();
 document.querySelectorAll('[data-drop]>button').forEach(el=>el.onclick=e=>{e.stopPropagation();const it=el.parentElement;const was=it.classList.contains('open');document.querySelectorAll('.navitem.open').forEach(n=>n.classList.remove('open'));if(!was)it.classList.add('open');});
 document.querySelectorAll('[data-panel]').forEach(el=>el.onclick=()=>el.parentElement.classList.toggle('collapsed'));
}
document.addEventListener('click',()=>document.querySelectorAll('.navitem.open').forEach(n=>n.classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
if(!location.hash)location.hash='#/login';
render();

</script>
